<!DOCTYPE html>
<html lang="pt-BR">
<meta charset="UTF-8">
<title>Página 4</title>

<style>
    * {
        margin:0;
        padding:0;
        box-sizing:border-box;
    }
    body {
        width:100vw;
        height:100vh;
        background-color:rgba(230, 245, 178, 0.971)
    }
</style>

<script>
  function verificarResposta3() {
    const opcoes = document.getElementsByName("resposta3");
    let escolhida = "";

    for (let i = 0; i < opcoes.length; i++) {
      if (opcoes[i].checked) {
        escolhida = opcoes[i].value;
      }
    }

    const resultado = document.getElementById("resultado3");

    if (escolhida === "Lo") {
      resultado.textContent = "Correto!";
      resultado.style.color = "green";
      document.querySelector("button2").hidden = false; 
    } else {
      resultado.textContent = "Errado!";
      resultado.style.color = "red";
      document.querySelector("button2").hidden = true; 
    }
  }
</script>

<div class="pergunta3">

  <label9>
    <input type="radio" name="resposta3" value="Lo">
    Lorena
  </label9><br><br>

  <label10>
    <input type="radio" name="resposta3" value="Mi">
    Miguel
  </label10><br><br>

<button onclick="verificarResposta3()" style="padding:10px 24px; border:none; background:#3d718b; color:white; border-radius:9px;">
Verificar resposta
</button>
  <p id="resultado3"></p>
</div>

<style>
    .pergunta3 {
        position:absolute;
        top: 50%;

    label9, label10 {

</style>
